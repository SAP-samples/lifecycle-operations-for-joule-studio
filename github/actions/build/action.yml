name: Build
description: Builds and validates a solution directory using the Joule Studio CLI.

inputs:
  path:
    description: Path to the solution directory to zip. Defaults to the repository root.
    required: false
    default: ${{ github.workspace }}

runs:
  using: composite
  steps:
    - name: Build solution
      shell: bash
      env:
        SOLUTION_PATH: ${{ inputs.path }}
      run: |
        cd "$SOLUTION_PATH"
        jl solution build
