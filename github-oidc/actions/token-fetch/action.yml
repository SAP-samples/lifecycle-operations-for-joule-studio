name: Fetch SCI Token
description: Obtains a short-lived GitHub-issued JWT and exchanges it for a Cloud Identity Services token.

inputs:
  sciTenantUrl:
    description: Issuer URI of the SAP Cloud Identity Services tenant
    required: true
  sciClientId:
    description: Client ID of the SCI application
    required: true

outputs:
  sciToken:
    description: The Cloud Identity Services access token
    value: ${{ steps.get-sci-token.outputs.sciToken }}

runs:
  using: composite
  steps:
    - name: Get SCI token
      id: get-sci-token
      shell: bash
      env:
        SCI_TENANT_URL: ${{ inputs.sciTenantUrl }}
        SCI_CLIENT_ID: ${{ inputs.sciClientId }}
      run: python3 $GITHUB_ACTION_PATH/fetch.py
